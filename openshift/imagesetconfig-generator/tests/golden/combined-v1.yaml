apiVersion: mirror.openshift.io/v1alpha2
kind: ImageSetConfiguration
mirror:
  operators:
  - catalog: example.com/operators/test-catalog:v1
    packages:
    - name: amq-streams
      channels:
      - name: stable  # default
    - name: amq-streams-console
      channels:
      - name: alpha  # default
    - name: local-storage-operator
      channels:
      - name: '3.15'  # default
      - name: stable
    - name: sample-operator
      channels:
      - name: preview
      - name: stable  # default